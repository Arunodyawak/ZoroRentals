<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Zoro Rentals | Edit Payment</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap');
    * { font-family: 'Poppins', sans-serif; }
    body { background: #f9fafc; }
  </style>
</head>
<body>

<!-- Same header as before -->
<header class="bg-white border-b border-gray-100 sticky top-0 z-30 shadow-sm">
  <div class="max-w-7xl mx-auto px-5 md:px-8 py-4 flex justify-between items-center">
    <a href="index.html"><img src="assets/images/header/zoro-logo-blue.png" class="h-20" alt="Zoro" onerror="this.src='https://placehold.co/120x40?text=Zoro'"></a>
    <div class="flex gap-4">
      <a href="payment.html" class="text-[#1e3a8a] font-medium">Payments</a>
      <a href="payment-history.html" class="text-gray-600 hover:text-[#1e3a8a]">History</a>
    </div>
  </div>
</header>

<main class="max-w-3xl mx-auto px-5 py-10">
  <div class="bg-white rounded-2xl shadow-md border p-6 md:p-8">
    <div class="flex items-center gap-3 mb-6">
      <a href="payment" class="text-gray-500 hover:text-gray-700">← Back</a>
      <h1 class="text-2xl font-bold text-gray-800">Update Payment Status</h1>
    </div>

    <!-- Sample payment data (would be fetched by ID from backend) -->
    <div class="bg-gray-50 rounded-xl p-5 mb-6">
      <div class="grid grid-cols-2 gap-4 text-sm">
        <div><span class="text-gray-500">Payment ID:</span> <span class="font-medium text-gray-800" id="paymentIdDisplay">PAY002</span></div>
        <div><span class="text-gray-500">Ride ID:</span> <span class="font-medium text-gray-800">RIDE567</span></div>
        <div><span class="text-gray-500">User:</span> <span class="font-medium text-gray-800">emma@example.com</span></div>
        <div><span class="text-gray-500">Amount:</span> <span class="font-semibold text-gray-900">LKR 12,450</span></div>
        <div><span class="text-gray-500">Date:</span> <span class="font-medium">2026-05-18 09:15</span></div>
      </div>
    </div>

    <!-- Update form -->
    <form id="updatePaymentForm" onsubmit="updatePaymentStatus(event)">
      <div class="mb-6">
        <label class="block text-gray-700 font-semibold mb-2">Payment Status</label>
        <select id="statusSelect" class="w-full border border-gray-300 rounded-xl px-4 py-3 focus:ring-2 focus:ring-[#2bd2ff]">
          <option value="PENDING">⏳ PENDING</option>
          <option value="COMPLETED" selected>✅ COMPLETED</option>
          <option value="FAILED">❌ FAILED</option>
          <option value="REFUNDED">🔄 REFUNDED</option>
        </select>
      </div>
      <div class="mb-6">
        <label class="block text-gray-700 font-semibold mb-2">Admin Notes (optional)</label>
        <textarea rows="3" class="w-full border border-gray-300 rounded-xl px-4 py-3" placeholder="e.g., Payment verified, status changed from pending to completed"></textarea>
      </div>
      <div class="flex gap-4">
        <button type="submit" class="bg-[#1e3a8a] hover:bg-[#15307a] text-white font-bold py-3 px-6 rounded-xl transition">Update Payment</button>
        <button type="button" onclick="window.location.href='payment-history.html'" class="border border-gray-300 hover:bg-gray-50 text-gray-700 font-medium py-3 px-6 rounded-xl">Cancel</button>
      </div>
    </form>
  </div>

  <!-- Additional: Delete as separate action -->
  <div class="mt-8 bg-red-50 border border-red-200 rounded-xl p-5">
    <h3 class="font-semibold text-red-800">Danger Zone</h3>
    <p class="text-sm text-red-700 mt-1">Remove this payment record permanently (failed/invalid).</p>
    <button onclick="deleteCurrentPayment()" class="mt-3 bg-red-600 hover:bg-red-700 text-white px-5 py-2 rounded-lg text-sm">Delete Payment</button>
  </div>
</main>

<footer class="bg-gray-900 text-gray-300 mt-20 py-6 text-center text-xs">Copyright 2026 Zoro Rentals</footer>

<script>
  // Simulate getting payment ID from URL query param
  const urlParams = new URLSearchParams(window.location.search);
  const paymentId = urlParams.get('id') || 'PAY002';
  document.getElementById('paymentIdDisplay').innerText = paymentId;

  function updatePaymentStatus(e) {
    e.preventDefault();
    const newStatus = document.getElementById('statusSelect').value;
    alert(`✅ Payment ${paymentId} status updated to ${newStatus}. (Demo: In real app, this writes to payments.txt via backend.)`);
    // Redirect to history after demo
    window.location.href = 'payment-history.html';
  }

  function deleteCurrentPayment() {
    if(confirm(`⚠️ Permanently delete payment ${paymentId}? This action is irreversible.`)) {
      alert(`🗑️ Payment ${paymentId} deleted. Redirecting to history.`);
      window.location.href = 'payment-history.html';
    }
  }
</script>
</body>
</html>

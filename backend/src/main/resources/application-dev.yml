spring:
  datasource:
    url: jdbc:h2:mem:zoro;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update

server:
  port: 8080

app:
  upload-dir: ${UPLOAD_DIR:uploads}

logging:
  level:
    root: INFO
